name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: client
            asset: rouillo-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: client.exe
            asset: rouillo-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libxkbcommon-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build client (release)
        run: cargo build --release -p client --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      # The bare binary runs as is; the archive adds what a desktop needs to
      # show the game in its menus with its icon (see scripts/install-linux.sh).
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          # Built aside: the bare binary already holds this name here.
          dir=rouillo-linux-x86_64
          mkdir -p "pkg/$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "pkg/$dir/rouillo"
          cp scripts/install-linux.sh "pkg/$dir/install.sh"
          cp -r assets/linux/share "pkg/$dir/share"
          tar -czf "$dir.tar.gz" -C pkg "$dir"

      - name: Attach binary to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}
            rouillo-linux-x86_64.tar.gz
          draft: true
          generate_release_notes: true
