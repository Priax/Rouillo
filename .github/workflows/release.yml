name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: client
            asset: rouillo-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: client.exe
            asset: rouillo-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p')
          [ "$GITHUB_REF_NAME" = "v$version" ] \
            || { echo "tag $GITHUB_REF_NAME, Cargo.toml says $version" >&2; exit 1; }

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libxkbcommon-dev libasound2-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build client (release)
        run: cargo build --release -p client --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      # The bare binary runs as is; the archive adds what a desktop needs to
      # show the game in its menus with its icon (see scripts/install-linux.sh).
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          # Built aside: the bare binary already holds this name here.
          dir=rouillo-linux-x86_64
          mkdir -p "pkg/$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "pkg/$dir/rouillo"
          cp scripts/install-linux.sh "pkg/$dir/install.sh"
          cp -r assets/linux/share "pkg/$dir/share"
          tar -czf "$dir.tar.gz" -C pkg "$dir"

      - name: Keep the files for the release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            rouillo-linux-x86_64.tar.gz
          if-no-files-found: ignore

  # The game updates itself from the latest release, so only a signed and
  # complete set of files is published, all at once.
  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sign the binaries
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "the RELEASE_SIGNING_KEY secret is missing" >&2; exit 1; }
          key=$(mktemp)
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          scripts/sign-release.sh "$key" "${GITHUB_REF_NAME#v}" dist/rouillo-linux-x86_64 dist/rouillo-windows-x86_64.exe
          rm "$key"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
