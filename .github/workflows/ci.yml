name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting uses unstable rustfmt options (imports_granularity, group_imports
  # in rustfmt.toml), which only apply on nightly. Checking with stable would
  # silently ignore them, so this job must run nightly rustfmt.
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --check

  # Clippy and tests share one job so the (slow) native client build via notan
  # is compiled once and reused across both steps.
  check:
    name: clippy + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: puyo
          POSTGRES_PASSWORD: puyo
          POSTGRES_DB: puyorust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # notan builds natively against system X11/GL/audio libraries.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libxkbcommon-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Database tests
        env:
          DATABASE_URL: postgres://puyo:puyo@localhost:5432/puyorust_test
        run: cargo test -p server db_ -- --ignored

  # The server runs on aarch64, the clients on x86-64 and wasm32, and the
  # netcode needs them to simulate bit for bit alike. The golden-hash test
  # pins that; this runs it on ARM, as a release build like the server's, so
  # a disagreement shows up here rather than on the VM before a deploy.
  determinism-arm:
    name: simulation on aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shared --release

  # The browser build has code of its own (Web Audio, local storage) that the
  # native jobs never compile. Nothing to install: notan needs no system
  # libraries on wasm.
  wasm:
    name: clippy (wasm client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p client --target wasm32-unknown-unknown -- -D warnings
