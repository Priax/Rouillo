[package]
name = "client"
version.workspace = true
edition = "2021"

[dependencies]
aero = { git = "ssh://git@github.com/Priax/aero.git", rev = "be78ea2441e69bf5cdb5be20fa5042e87c619726", features = ["serde", "gamepad"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ewebsock = { version = "0.8", features = ["tls"] }
ehttp = "0.7"
shared = { path = "../shared" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ehttp = { version = "0.7", features = ["streaming"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
rfd = "0.18"
ed25519-dalek = "3"
sha2 = "0.11"
self-replace = "1"
web-transport-quinn = "0.14"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
url = "2"

[target.'wasm32-unknown-unknown'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "History", "Storage",
    "EventTarget", "Event", "UiEvent", "KeyboardEvent", "CompositionEvent",
    "Document", "Node", "Element", "HtmlElement", "HtmlInputElement", "CssStyleDeclaration",
    "ClipboardEvent", "DataTransfer",
    "FileList", "File", "Blob", "FileReader",
    "AudioContext", "AudioContextState", "BaseAudioContext",
    "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode",
    "OscillatorNode", "OscillatorType",
    "GainNode", "AudioParam",
] }

[dev-dependencies]
shared = { path = "../shared", features = ["test-support"] }

[lints]
workspace = true
