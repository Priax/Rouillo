[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
notan = "0.14.0"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ewebsock = "0.8"
ehttp = "0.5"
shared = { path = "../shared" }

[package.metadata.notan.assets]
search = ["assets"]

[target.'wasm32-unknown-unknown'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window", "Location", "Storage",
    "AudioContext", "BaseAudioContext",
    "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode",
    "OscillatorNode", "OscillatorType",
    "GainNode", "AudioParam",
] }
