[package]
name = "client"
version.workspace = true
edition = "2021"

[dependencies]
notan = { version = "0.14.0", optional = true, default-features = false, features = ["backend", "log", "draw", "shaderc", "serde"] }
aero-notan = { path = "../aero-notan", optional = true }
ab_glyph = "0.2"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ewebsock = { version = "0.8", features = ["tls"] }
ehttp = "0.7"
gilrs = "0.11"
shared = { path = "../shared" }

[features]
default = ["aero"]
aero = ["dep:aero-notan"]
# The former backend, kept while the client moves to Aero's own API.
notan = ["dep:notan"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.notan.assets]
search = ["assets"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ehttp = { version = "0.7", features = ["streaming"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
arboard = { version = "3", default-features = false }
rfd = "0.18"
ed25519-dalek = "3"
sha2 = "0.11"
self-replace = "1"
display-info = "0.5"
web-transport-quinn = "0.14"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
url = "2"

[target.'wasm32-unknown-unknown'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "History", "Storage", "Performance",
    "EventTarget", "Event", "UiEvent", "KeyboardEvent", "CompositionEvent",
    "Document", "Node", "Element", "HtmlElement", "HtmlInputElement", "CssStyleDeclaration",
    "ClipboardEvent", "DataTransfer",
    "FileList", "File", "Blob", "FileReader",
    "AudioContext", "AudioContextState", "BaseAudioContext",
    "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode",
    "OscillatorNode", "OscillatorType",
    "GainNode", "AudioParam",
] }

[dev-dependencies]
shared = { path = "../shared", features = ["test-support"] }

[lints]
workspace = true
