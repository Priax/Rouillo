[package]
name = "client"
version.workspace = true
edition = "2021"

[dependencies]
notan = { version = "0.14.0", features = ["serde"] }
ab_glyph = "0.2"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ewebsock = { version = "0.8", features = ["tls"] }
ehttp = "0.7"
gilrs = "0.11"
shared = { path = "../shared" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.notan.assets]
search = ["assets"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback"] }
arboard = { version = "3", default-features = false }
rfd = "0.17"
ed25519-dalek = "2"
sha2 = "0.10"
self-replace = "1"

[target.'wasm32-unknown-unknown'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "Storage", "Performance",
    "EventTarget", "Event", "UiEvent", "KeyboardEvent", "CompositionEvent",
    "Document", "Node", "Element", "HtmlElement", "HtmlInputElement", "CssStyleDeclaration",
    "ClipboardEvent", "DataTransfer",
    "FileList", "File", "Blob", "FileReader",
    "AudioContext", "AudioContextState", "BaseAudioContext",
    "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode",
    "OscillatorNode", "OscillatorType",
    "GainNode", "AudioParam",
] }

[lints]
workspace = true
