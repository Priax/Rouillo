[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
notan = "0.14.0"
ab_glyph = "0.2"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ewebsock = { version = "0.8", features = ["tls"] }
ehttp = "0.7"
shared = { path = "../shared" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.notan.assets]
search = ["assets"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[target.'wasm32-unknown-unknown'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window", "Location", "Storage", "Performance",
    "AudioContext", "BaseAudioContext",
    "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode",
    "OscillatorNode", "OscillatorType",
    "GainNode", "AudioParam",
] }

[lints]
workspace = true
