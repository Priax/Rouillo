[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"
rand_chacha = { version = "0.10", features = ["serde"] }
bitcode = { version = "0.6", features = ["serde"] }
lz4_flex = { version = "0.13", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "sim"
harness = false
