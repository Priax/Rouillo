[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"
rand_chacha = { version = "0.10", features = ["serde"] }
bitcode = { version = "0.6", features = ["serde"] }
# Safe encode/decode: the server decompresses what clients send, and with
# messages of ~100 bytes the unsafe fast path buys nothing. `std` enables the
# allocating block API used by `encode`/`decode`; the frame format is unused.
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "sim"
harness = false

[lints]
workspace = true
