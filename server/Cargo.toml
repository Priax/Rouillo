[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = { version = "0.4.3", features = ["websocket", "server"] }
futures-util = "0.3"
# Only to build the listening socket with TCP_NODELAY set; warp accepts
# connections itself and never hands out the accepted socket.
socket2 = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
console-subscriber = { version = "0.5", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

shared = { path = "../shared" }

[dev-dependencies]
# In-process WebSocket client, to test `handle_connection` end to end.
warp = { version = "0.4.3", features = ["websocket", "server", "test"] }
# `test-util` is not part of tokio's `full`: it brings the paused clock, so the
# idle-socket timeout can be tested without a test that really waits it out.
tokio = { version = "1", features = ["full", "test-util"] }

[features]
# tokio-console support. Build with:
#   RUSTFLAGS="--cfg tokio_unstable" cargo run -p server --features console
# Off by default so normal builds pull neither console-subscriber nor tokio/tracing.
console = ["dep:console-subscriber", "tokio/tracing"]
