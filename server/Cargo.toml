[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = { version = "0.4.3", features = ["websocket", "server"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
console-subscriber = { version = "0.5", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

shared = { path = "../shared" }

[features]
# tokio-console support. Build with:
#   RUSTFLAGS="--cfg tokio_unstable" cargo run -p server --features console
# Off by default so normal builds pull neither console-subscriber nor tokio/tracing.
console = ["dep:console-subscriber", "tokio/tracing"]
