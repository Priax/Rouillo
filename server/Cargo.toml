[package]
name = "server"
version.workspace = true
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "macros"] }
futures-util = "0.3"
socket2 = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
console-subscriber = { version = "0.5", optional = true }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

shared = { path = "../shared" }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }

[features]
# tokio-console support. Build with:
#   RUSTFLAGS="--cfg tokio_unstable" cargo run -p server --features console
# Off by default so normal builds pull neither console-subscriber nor tokio/tracing.
console = ["dep:console-subscriber", "tokio/tracing"]

[lints]
workspace = true
